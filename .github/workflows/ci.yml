name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Score realistic MCP tool-selection evaluation
        run: npm run eval:selection:score -- evals/mcp-tool-selection.json evals/mcp-tool-selection-results.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply idempotent D1 hardening migration
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0002_hardening.sql
      - name: Create MCP funnel schema before code cutover
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0003_mcp_funnel.sql
      - name: Establish dashboard zero-count baseline before code cutover
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0005_dashboard_reset.sql
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Close the old-worker telemetry gap
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0003_mcp_funnel.sql
      - name: Verify deployment health
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          URL="${{ vars.SERVICE_URL || 'https://upgradelens.mattpicone.workers.dev' }}"
          BODY=$(curl -fsS -A "upgradelens-ci" "$URL/healthz")
          echo "$BODY"
          echo "$BODY" | node -e '
            let raw="";
            process.stdin.on("data", d => raw += d).on("end", () => {
              const health = JSON.parse(raw);
              if (health.db !== "ok" || health.telemetry_schema !== "ok") {
                console.error("::error::Post-deploy DB/telemetry schema check failed. Roll back the Worker if needed.");
                process.exit(1);
              }
            });
          '
      - name: Reassert dashboard zero-count baseline after health check
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0005_dashboard_reset.sql
      - name: Activate clean business-validation clock
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute upgradelens --remote --file=./migrations/0004_activate_validation.sql
      - name: Verify all production MCP tools (owner-tagged, excluded from business)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.OWNER_TOKEN != ''
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL || 'https://upgradelens.mattpicone.workers.dev' }}
        run: npm run verify:production:mcp
      - name: Skip owner-tagged MCP verification note
        if: env.CLOUDFLARE_API_TOKEN != '' && env.OWNER_TOKEN == ''
        run: echo "OWNER_TOKEN secret not configured — production deployment passed, but all-tool owner verification must be run manually."
      - name: Skip note
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not configured — deploy skipped (tests still gate merges)."
