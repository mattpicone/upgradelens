name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC auth to registry.modelcontextprotocol.io
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify immutable v0.3.1 contract before publishing
        run: npm run contract:check
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
      - name: Verify listing
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.mattpicone/upgradelens" | node -e '
            let raw="";
            process.stdin.on("data", d => raw += d).on("end", () => {
              const body = JSON.parse(raw);
              let found = false;
              const visit = value => {
                if (!value || typeof value !== "object") return;
                if (value.name === "io.github.mattpicone/upgradelens" && value.version === "0.3.1") found = true;
                for (const child of Object.values(value)) visit(child);
              };
              visit(body);
              if (!found) {
                console.error("Exact v0.3.1 Registry record was not returned after publish.");
                process.exit(1);
              }
            });
          '
