# UpgradeLens — Cloudflare Workers (free plan) configuration.
# Edge rate-limit bindings handle minute bursts without consuming D1 writes.
# D1 retains conservative daily quotas, cache data, and validated tool telemetry.

name = "upgradelens"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["17 */6 * * *"] # refresh freshness/aggregate rollups every 6h

[[d1_databases]]
binding = "DB"
database_name = "upgradelens"
database_id = "b5bc2cda-1005-4a18-9ab5-581c04ff4bd5"

[[ratelimits]]
name = "ANON_RATE_LIMITER"
namespace_id = "11001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "KEY_RATE_LIMITER"
namespace_id = "11002"
  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
ANALYSIS_VERSION = "2"
SERVICE_VERSION = "0.2.1"
PAYMENTS_ENABLED = "false"
PUBLIC_BASE_URL = "https://upgradelens.mattpicone.workers.dev"
ALLOWED_ORIGINS = "https://upgradelens.mattpicone.workers.dev"

# Secrets (set via `wrangler secret put`):
#   OWNER_TOKEN     — auth token for /dashboard and internal-traffic classification
#   ADMIN_KEY       — key for privileged admin endpoints (precompute upserts from CI)
