# UpgradeLens — Cloudflare Workers (free plan) configuration.
# Edge rate-limit bindings handle minute bursts without consuming D1 writes.
# D1 retains conservative daily quotas, cache data, and validated tool telemetry.

name = "upgradelens"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"] # bounded payment reconciliation and stale-work maintenance

[[d1_databases]]
binding = "DB"
database_name = "upgradelens"
database_id = "b5bc2cda-1005-4a18-9ab5-581c04ff4bd5"

[[ratelimits]]
name = "ANON_RATE_LIMITER"
namespace_id = "11001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "KEY_RATE_LIMITER"
namespace_id = "11002"
  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
ANALYSIS_VERSION = "2"
SERVICE_VERSION = "0.3.0"
PAYMENTS_ENABLED = "false"
PAYMENT_MODE = "validation"
KNOWN_UNIT_COST_MICROS = "1000"
PUBLIC_BASE_URL = "https://upgradelens.mattpicone.workers.dev"

# Secrets (set via `wrangler secret put`):
#   OWNER_TOKEN     — auth token for /dashboard and internal-traffic classification
#   ADMIN_KEY       — key for privileged admin endpoints (precompute upserts from CI)
#   TRIAL_HMAC_SECRET — secret for the rolling pseudonymous free-unit identity
#   PAYMENT_RECOVERY_SECRET — encryption key for pending x402 reconciliation
#   CDP_API_KEY_ID / CDP_API_KEY_SECRET — facilitator credentials (paid modes only)
#   X402_PAY_TO — verified Base recipient address (paid modes only)
#   RELEASE_GIT_SHA / RELEASE_LOCKFILE_HASH / RELEASE_SUITE_HASH — exact
#     fingerprints emitted by `npm run rollout:attest`; required for mainnet
#   MCP_TESTNET_TOKEN — optional owner-controlled token for the non-advertised
#     same-Worker Base Sepolia acceptance endpoint `/mcp-testnet`
