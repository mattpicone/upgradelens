# UpgradeLens — Cloudflare Workers (free plan) configuration.
# NOTE: KV is intentionally NOT used: the free plan allows only 1,000 KV writes/day,
# which cannot support per-request rate limiting or caching. D1 (100k writes/day,
# 5M reads/day) handles cache, telemetry and rate limiting instead.

name = "upgradelens"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["17 */6 * * *"] # refresh freshness/aggregate rollups every 6h

[[d1_databases]]
binding = "DB"
database_name = "upgradelens"
database_id = "b5bc2cda-1005-4a18-9ab5-581c04ff4bd5"

[vars]
ANALYSIS_VERSION = "1"
SERVICE_VERSION = "0.1.0"
PAYMENTS_ENABLED = "false"
PUBLIC_BASE_URL = "https://upgradelens.mattpicone.workers.dev"

# Secrets (set via `wrangler secret put`):
#   OWNER_TOKEN     — auth token for /dashboard and internal-traffic classification
#   ADMIN_KEY       — key for privileged admin endpoints (precompute upserts from CI)
